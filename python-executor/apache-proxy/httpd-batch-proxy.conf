# 1c-batch: local reverse proxy fragment for Apache 2.4.
# Include once, at server scope, after the existing LoadModule directives.
# Applying this file under C:/Apache24/ requires separate user approval.
# Prerequisites already present on the inspected server:
# authz_core_module, log_config_module, setenvif_module.

<IfModule !proxy_module>
    LoadModule proxy_module modules/mod_proxy.so
</IfModule>
<IfModule !proxy_http_module>
    LoadModule proxy_http_module modules/mod_proxy_http.so
</IfModule>
<IfModule !rewrite_module>
    LoadModule rewrite_module modules/mod_rewrite.so
</IfModule>

# Do not enable a forward proxy.
ProxyRequests Off

# LimitRequestBody alone does not enforce the proxied Content-Length here.
# Reject known oversized bodies before forwarding; only /batch/ is affected.
# Bodies without Content-Length still use the executor's own streaming limit.
RewriteEngine On
RewriteCond %{REQUEST_URI} ^/batch/
RewriteCond %{HTTP:Content-Length} -gt33554432
RewriteRule ^ - [R=413,L]

# Keep the longest backend URL first: separate workers retain their timeouts.
# Upload: backend processing limit 120 s + reserve, client HTTP wait 180 s.
# Worker timeout is socket I/O inactivity, not a total upload deadline.
ProxyPass "/batch/v1/files" "http://127.0.0.1:8765/v1/files" connectiontimeout=5 timeout=150 retry=0
ProxyPass "/batch/" "http://127.0.0.1:8765/" connectiontimeout=5 timeout=60 retry=0
ProxyPassReverse "/batch/" "http://127.0.0.1:8765/"

<Location "/batch/">
    Require all granted
    ProxyPreserveHost Off
    ProxyErrorOverride Off
    LimitRequestBody 33554432
    LogLevel proxy:warn proxy_http:warn
</Location>

# Pass Authorization, HTTP methods, body bytes, content types and cache headers
# normally. The backend creates 202 and external /batch/... links in JSON;
# ProxyPassReverse only translates matching internal URLs in response headers.
# No body filters, artificial 202 responses or BAT commands belong here.

<IfModule cache_module>
    CacheDisable "/batch/"
</IfModule>

# A separate access log without request bodies, Authorization or query strings.
# Existing main-server access/error logs remain in force.
# The syntax checker overrides BATCH_ACCESS_LOG with a workspace-local path.
<IfDefine !BATCH_ACCESS_LOG>
    Define BATCH_ACCESS_LOG "logs/batch_access.log"
</IfDefine>
SetEnvIf Request_URI "^/batch/" batch_proxy_request
LogFormat "%t %a %m %U status=%>s bytes=%B duration_us=%D backend_status=%{proxy-status}n" batch_proxy_safe
CustomLog "${BATCH_ACCESS_LOG}" batch_proxy_safe env=batch_proxy_request
